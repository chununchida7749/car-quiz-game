<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ขับรถกวนประสาท 🚗💨</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;min-height:100vh}
.wrap{width:min(100%,520px);padding:12px}.top{display:flex;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:8px}.game{position:relative;height:min(78vh,700px);min-height:540px;background:#555;border-radius:22px;overflow:hidden;border:3px solid #333}
.road{position:absolute;inset:0;background:linear-gradient(90deg,#333 0 8%,#555 8% 92%,#333 92%);overflow:hidden}
.road:before,.road:after{content:"";position:absolute;top:-100%;height:300%;width:7px;background:repeating-linear-gradient(to bottom,#eee 0 55px,transparent 55px 110px);opacity:.7;animation:road 1s linear infinite}
.road:before{left:33.33%}.road:after{left:66.66%}@keyframes road{to{transform:translateY(110px)}}
.car{position:absolute;width:92px;height:125px;border-radius:22px;background:#e33;bottom:24px;transition:left .13s;box-shadow:0 6px 10px #0008;z-index:5}
.window{position:absolute;left:10px;right:10px;top:12px;height:58px;border-radius:15px;background:#bfe9ff;overflow:hidden;border:3px solid #222}.window img{width:100%;height:100%;object-fit:cover}.wheel{position:absolute;width:18px;height:34px;background:#111;border-radius:8px;top:48px}.wl{left:-8px}.wr{right:-8px}.bumper{position:absolute;left:13px;right:13px;bottom:8px;height:8px;border-radius:10px;background:#222}
.enemy{position:absolute;width:82px;height:105px;border-radius:20px;background:#1d9bf0;z-index:3;box-shadow:0 5px 9px #0008}.enemy .window{height:52px}.enemy .wheel{top:44px}
.hud{position:absolute;z-index:10;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 3px #000}
.start,.quiz,.end{position:absolute;inset:0;z-index:20;background:#000b;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}
.panel{background:#fff;color:#222;border-radius:24px;padding:24px;width:100%;max-width:430px;box-shadow:0 12px 30px #0008}.panel h1{margin:0 0 8px;font-size:28px}.panel p{margin:8px 0 18px}
.faces{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.facepick{width:58px;height:58px;border-radius:50%;padding:2px;border:3px solid #ddd;background:#fff}.facepick.sel{border-color:#ff3d81}.facepick img{width:100%;height:100%;border-radius:50%;object-fit:cover}
button{border:0;border-radius:15px;padding:13px 16px;font-size:17px;font-weight:900;cursor:pointer}.primary{background:#222;color:#fff;width:100%}.answers{display:grid;gap:9px}.answers button{background:#f1f1f1;text-align:left}.answers button.correct{background:#a7f3b5}.answers button.wrong{background:#ffb3b3}
.controls{display:flex;gap:12px;margin-top:10px}.ctrl{flex:1;background:#fff;font-size:28px;padding:8px}.hint{text-align:center;color:#ddd;font-size:13px;margin-top:5px}
.hidden{display:none!important}.toast{position:absolute;z-index:15;top:70px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 14px;border-radius:14px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span>🚗 ขับรถกวนประสาท</span><span id="score">คะแนน 0</span><span id="life">❤️❤️❤️</span></div>

<div class="start" id="start"><div class="panel"><h1>🚗💨 ขับหลบ + ตอบกวน</h1><p>หลบรถ/สิ่งกีดขวาง แล้วเจอคำถามกวน ๆ เป็นระยะ 😂<br>ตอบผิดเสียหัวใจ!</p><b>เลือกหน้าคนขับ</b><div class="faces" id="faces"></div><button class="primary" id="startBtn">เริ่มเกม 🔥</button></div></div>

const qs=[
["อะไรเอ่ย มีฟันเยอะ แต่กินข้าวไม่ได้?",["หวี","หมา","ฉลาม","ครู"],0],
["ถ้าเจอเสือในป่า สิ่งแรกที่ควรทำคืออะไร?",["วิ่ง","ถ่ายรูป","บอกเสือว่าใจเย็น","ตื่นจากฝัน"],3],
["ปลาอะไรไม่มีวันว่ายน้ำ?",["ปลาทอด","ปลาวาฬ","ปลาทู","ปลาทอง"],0],
["ยิ่งตัดยิ่งยาว คืออะไร?",["ถนน","ผม","เชือก","หนี้"],0],
["หนังสือไม่ชอบไปทะเลเพราะอะไร?",["กลัวเปียก","ไม่มีเงิน","กลัวโดนอ่าน","ไม่มีขา"],2],
["ถ้าข้อสอบยากมาก วิธีแก้แบบกวนที่สุดคือ?",["อ่านหนังสือ","ถามเพื่อน","ตั้งใจทำ","ส่งกระดาษเปล่าแล้วบอกว่า minimalist"],3],
["อะไรมีหน้าแต่ไม่มีตา มีเข็มแต่ไม่เย็บผ้า?",["นาฬิกา","แมว","โทรศัพท์","ครู"],0],
["ถ้าเพื่อนบอก 'เดี๋ยวคืนเงิน' ควรทำอะไร?",["เชื่อทันที","ร้องไห้","จดจำวันที่","ให้ยืมเพิ่ม"],2]
];
let lane=1,score=0,life=3,distance=0,playing=false,spawnTimer=0,qNext=5,answered=false,selected=0,enemyList=[];
const $=x=>document.getElementById(x);
faces.forEach((src,i)=>{let b=document.createElement("button");b.className="facepick"+(i===0?" sel":"");b.innerHTML=`<img src="${src}">`;b.onclick=()=>{selected=i;document.querySelectorAll(".facepick").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")};$("faces").appendChild(b)});
$("playerImg").src=faces[0];
function posLane(l){return `calc(${l*33.333333 + 16.666666}% - 46px)`}
function move(d){if(!playing)return;lane=Math.max(0,Math.min(2,lane+d));$("player").style.left=posLane(lane)}
$("left").onclick=()=>move(-1);$("right").onclick=()=>move(1);$("boost").onclick=()=>{if(playing){distance+=2;toast("💨 บูสต์!");}};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});
let sx=0;document.getElementById("game").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
document.getElementById("game").addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>35)move(dx>0?1:-1)},{passive:true});
function toast(t){let x=$("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),700)}
function spawn(){let l=Math.floor(Math.random()*3),e=document.createElement("div");e.className="enemy";e.style.left=posLane(l);e.style.top="-120px";e.innerHTML=`<div class="window"><img src="${faces[Math.floor(Math.random()*faces.length)]}"></div><div class="wheel wl"></div><div class="wheel wr"></div>`;$("road").appendChild(e);enemyList.push({el:e,l, y:-120})}
function crash(){life--; $("life").textContent="❤️".repeat(life)+"🖤".repeat(3-life);toast("💥 ชนแล้ว!");if(life<=0)end()}
function ask(){if(!playing)return;answered=false;let q=qs[Math.floor(Math.random()*qs.length)];$("question").textContent=q[0];$("answers").innerHTML="";q[1].forEach((a,n)=>{let b=document.createElement("button");b.textContent=a;b.onclick=()=>{if(answered)return;answered=true;if(n===q[2]){score+=10;toast("✅ ถูก! +10");}else{life--; $("life").textContent="❤️".repeat(life)+"🖤".repeat(3-life);toast("😂 ผิด! -1 ❤️");}$("score").textContent="คะแนน "+score;$("quiz").classList.add("hidden");if(life<=0)end();else{qNext=distance+6}};$("answers").appendChild(b)});$("qcount").textContent="คำถาม "+(Number($("qcount").textContent.split(" ")[1]||0)+1);$("quiz").classList.remove("hidden")}
function end(){playing=false;$("end").classList.remove("hidden");$("result").innerHTML=`ได้ <b>${score}</b> คะแนน<br>ระยะทาง ${Math.floor(distance)} เมตร<br>${score>=40?"🏆 เซียนกวนประสาท!":score>=20?"😎 ทำได้ดี!":"😂 อย่างน้อยรถก็ยังอยู่..."}`}
function loop(){
 if(!playing)return;
 distance+=0.04;spawnTimer++;
 if(spawnTimer>55){spawn();spawnTimer=0}
 enemyList.forEach(o=>{o.y+=4.4;o.el.style.top=o.y+"px";if(o.y>520){o.el.remove();o.dead=true}if(!o.dead && o.l===lane && o.y>400 && o.y<535){o.dead=true;o.el.remove();crash()}});
 enemyList=enemyList.filter(o=>!o.dead);
 $("distance").textContent="ระยะ "+Math.floor(distance);
 $("score").textContent="คะแนน "+score;
 if(distance>=qNext && $("quiz").classList.contains("hidden")) ask();
 requestAnimationFrame(loop);
}
function startGame(){selected=selected||0;$("playerImg").src=faces[selected];lane=1;score=0;life=3;distance=0;qNext=5;spawnTimer=0;enemyList.forEach(o=>o.el.remove());enemyList=[];$("life").textContent="❤️❤️❤️";$("score").textContent="คะแนน 0";$("start").classList.add("hidden");$("end").classList.add("hidden");$("quiz").classList.add("hidden");playing=true;$("player").style.left=posLane(lane);requestAnimationFrame(loop)}
$("startBtn").onclick=startGame;$("again").onclick=startGame;
</script>
</body></html>
